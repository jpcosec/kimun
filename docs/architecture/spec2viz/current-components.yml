id: sldb.current.components
title: "SLDB System Components (Current Codebase)"
type: component
version: "2.1"

data:
  nodes:
    SLDBCLI:
      label: sldb CLI
      kind: core
      contains:
        - CLIDispatcher
        - CLIParsers
        - CLICommands
        - CLIGraphOps
        - CLIGraph

    CLIDispatcher:
      label: cli.dispatcher
      kind: core

    CLIParsers:
      label: cli.parsers.*
      kind: core
      contains:
        - ParsersCore
        - ParsersBasic
        - ParsersModels
        - ParsersDocs
        - ParsersFind
        - ParsersStores
        - ParsersSections
        - ParsersFields
        - ParsersPredicates
        - ParsersLegacy
        - ParsersMisc
        - ParsersProject
        - ParsersPublic
        - ParsersHidden

    ParsersCore:
      label: parsers.core
      kind: core
    ParsersBasic:
      label: parsers.basic
      kind: core
    ParsersModels:
      label: parsers.models1 / models2
      kind: core
    ParsersDocs:
      label: parsers.docs1 / docs2
      kind: core
    ParsersFind:
      label: parsers.find
      kind: core
    ParsersStores:
      label: parsers.stores
      kind: core
    ParsersSections:
      label: parsers.sections
      kind: core
    ParsersFields:
      label: parsers.fields
      kind: core
    ParsersPredicates:
      label: parsers.predicates
      kind: core
    ParsersLegacy:
      label: parsers.legacy
      kind: core
    ParsersMisc:
      label: parsers.misc
      kind: core
    ParsersProject:
      label: parsers.project
      kind: core
    ParsersPublic:
      label: parsers.public
      kind: core
    ParsersHidden:
      label: parsers.hidden
      kind: core

    CLICommands:
      label: cli.commands.*
      kind: core
      contains:
        - DirectCommands
        - StoreCommands
        - ModelCommands
        - DocCommands
        - QueryCommands
        - LinksCommands
        - PredicatesCommands
        - ASTCommands
        - LintCommands
        - InboxCommands
        - ExploreCommands

    DirectCommands:
      label: basic / init / help / faq
      kind: core
    StoreCommands:
      label: store/add/check/init/update / semantic_map / stores
      kind: core
    ModelCommands:
      label: model/add/update / models/create/list/validate/template/fields
      kind: core
    DocCommands:
      label: doc / docs
      kind: core
    QueryCommands:
      label: find / sections / fields / query
      kind: core
    LinksCommands:
      label: links
      kind: core
    PredicatesCommands:
      label: predicates
      kind: core
    ASTCommands:
      label: ast
      kind: core
    LintCommands:
      label: lint
      kind: core
    InboxCommands:
      label: inbox
      kind: core
    ExploreCommands:
      label: explore
      kind: core

    CLIGraphOps:
      label: cli.graph_ops.*
      kind: core
      contains:
        - GraphBuildAST
        - GraphBuildIR
        - GraphIterRecords
        - GraphExtract
        - GraphFields
        - GraphMatches
        - GraphResolve

    GraphBuildAST:
      label: graph_ops.build_ast
      kind: core
    GraphBuildIR:
      label: graph_ops.build_ir
      kind: core
    GraphIterRecords:
      label: graph_ops.iter_records
      kind: core
    GraphExtract:
      label: graph_ops.extract
      kind: core
    GraphFields:
      label: graph_ops.fields / map_fields
      kind: core
    GraphMatches:
      label: graph_ops.matches
      kind: core
    GraphResolve:
      label: graph_ops.resolve
      kind: core

    CLIGraph:
      label: cli.graph.*
      kind: core
      contains:
        - GraphModelsSection
        - GraphSearchRecord
        - GraphSectionRecord
        - GraphSections
        - GraphStoreAST

    GraphModelsSection:
      label: graph.models_section
      kind: core
    GraphSearchRecord:
      label: graph.search_record
      kind: core
    GraphSectionRecord:
      label: graph.section_record
      kind: core
    GraphSections:
      label: graph.sections
      kind: core
    GraphStoreAST:
      label: graph.store_ast
      kind: core

    StoreFacade:
      label: store.facade
      kind: interface

    CoreRuntime:
      label: Core Runtime
      kind: core
      contains:
        - ASTPackage
        - ContractsPackage
        - IRPackage
        - DataExtractor
        - TemplateExtractor
        - ExtractorPackage
        - Renderer
        - RendererEngine
        - Handlers
        - ExceptionsPackage
        - ModelContract
        - SLDBNode
        - NodeHandler
        - IngestEngine

    ASTPackage:
      label: core.ast.* (base / markdown_ast_handler)
      kind: core
    ContractsPackage:
      label: core.contracts.* (marker / node_data / render_context)
      kind: core
    IRPackage:
      label: core.ir.* (document_ir / graph_view / surface_node / meaning_node)
      kind: core
    DataExtractor:
      label: core.data_extractor
      kind: core
    TemplateExtractor:
      label: core.template_extractor
      kind: core
    ExtractorPackage:
      label: core.extractor.recipe_matcher
      kind: core
    Renderer:
      label: core.renderer
      kind: core
    RendererEngine:
      label: core.renderer_engine.* (base / list / table / yaml / python_expr)
      kind: core
    Handlers:
      label: core.handlers.*
      kind: core
      contains:
        - TextHandler
        - ListHandler
        - TableHandler
        - YamlHandler
        - RouterHandler

    TextHandler:
      label: handlers.text
      kind: core
    ListHandler:
      label: handlers.list
      kind: core
    TableHandler:
      label: handlers.table
      kind: core
    YamlHandler:
      label: handlers.yaml
      kind: core
    RouterHandler:
      label: handlers.router
      kind: core

    ExceptionsPackage:
      label: core.exceptions.*
      kind: core

    ModelContract:
      label: models.structured_doc
      kind: core

    SLDBNode:
      label: core.node (SLDBNode dataclass)
      kind: core

    NodeHandler:
      label: core.node_handler
      kind: core

    IngestEngine:
      label: core.ingest.* (engine / scanner / manifest / renderer / source_parser)
      kind: core

    ValidationRuntime:
      label: runtime.validation
      kind: core

    RuntimeConfig:
      label: runtime.config
      kind: core

    StoreSubsystem:
      label: Store Subsystem
      kind: core
      contains:
        - StoreModels
        - StoreIOPackage
        - StoreHashing
        - StoreOps
        - StoreDiagnostics
        - StoreResolver
        - StoreSemantic
        - StoreExport
        - StoreMigration
        - StorePredicates
        - StoreQuery
        - StoreSectionRebuild
        - StoreFacadePkg

    StoreModels:
      label: store.models.*
      kind: core
      contains:
        - StoreModelEntries
        - StoreModelDocSections
        - StoreModelSemantic
        - StoreModelSections
        - StoreModelPredicates

    StoreModelEntries:
      label: document_entry / model_entry / store_entry
      kind: core
    StoreModelDocSections:
      label: doc_sections
      kind: core
    StoreModelSemantic:
      label: semantic_d_a_g / semantic_node / semantic_document_record / semantic_index
      kind: core
    StoreModelSections:
      label: sections_index / section_context_record
      kind: core
    StoreModelPredicates:
      label: predicate_entry
      kind: core

    StoreIOPackage:
      label: store.io.*
      kind: core
      contains:
        - IODocuments
        - IOModels
        - IOLock
        - IOStoreIndex
        - IOSectionsIndex
        - IOSemanticDAG
        - IOSemanticIndex
        - IOUtils

    IODocuments:
      label: io.documents_index
      kind: core
    IOModels:
      label: io.models_index
      kind: core
    IOLock:
      label: io.lock
      kind: core
    IOStoreIndex:
      label: io.store_index
      kind: core
    IOSectionsIndex:
      label: io.sections_index
      kind: core
    IOSemanticDAG:
      label: io.semantic_dag
      kind: core
    IOSemanticIndex:
      label: io.semantic_index
      kind: core
    IOUtils:
      label: io.utils
      kind: core

    StoreHashing:
      label: store.hashing
      kind: core
    StoreOps:
      label: store.ops
      kind: core
    StoreDiagnostics:
      label: store.diagnostics
      kind: core
    StoreDiagnosticsModels:
      label: diagnostics_models.* (store/model/document/diagnosis_note)
      kind: core
    StoreResolver:
      label: store.resolver
      kind: core
    StoreSemantic:
      label: store.semantic
      kind: core
    StoreSemanticTags:
      label: store.semantic_tags
      kind: core
    StoreExport:
      label: store.export
      kind: core
    StoreMigration:
      label: store.migration
      kind: core
    StorePredicates:
      label: store.predicates
      kind: core
    StoreQuery:
      label: store.query
      kind: core
    StoreSectionRebuild:
      label: store.section_rebuild
      kind: core
    StoreFacadePkg:
      label: store.facade
      kind: core

    QueryEngine:
      label: Query Engine
      kind: core
      contains:
        - QEStructural
        - QESemantic
        - QEGlobalSemantic
        - QEFilter
        - QEModels
        - QESemanticUtils
        - QEStructuralQueries

    QEStructural:
      label: query_engine.structural
      kind: core
    QESemantic:
      label: query_engine.semantic
      kind: core
    QEGlobalSemantic:
      label: query_engine.global_semantic
      kind: core
    QEFilter:
      label: query_engine.filter
      kind: core
    QEModels:
      label: query_engine.models
      kind: core
    QESemanticUtils:
      label: query_engine.semantic_utils
      kind: core
    QEStructuralQueries:
      label: query_engine.structural_queries
      kind: core

    LinksPackage:
      label: links.*
      kind: core
      contains:
        - LinkParser
        - LinkResolver
        - LinkComposer
        - LinkRecovery
        - ParsedLink
        - ResolvedLink

    LinkParser:
      label: links.parser
      kind: core
    LinkResolver:
      label: links.resolver
      kind: core
    LinkComposer:
      label: links.composer
      kind: core
    LinkRecovery:
      label: links.recovery
      kind: core
    ParsedLink:
      label: links.parsed_link
      kind: core
    ResolvedLink:
      label: links.resolved_link
      kind: core

    Filesystem:
      label: Filesystem
      kind: boundary
      contains:
        - MarkdownDocs
        - StoreFiles

    MarkdownDocs:
      label: Markdown docs
      kind: boundary
    StoreFiles:
      label: .sldb YAML indexes
      kind: database

    AssetsPackage:
      label: assets (skills)
      kind: core

  edges:
    - from: CLICommands
      to: StoreFacade
      relation: uses
      label: domain operations

    - from: StoreFacade
      to: StoreSubsystem
      relation: delegates
      label: store operations

    - from: CLICommands
      to: ValidationRuntime
      relation: uses
      label: roundtrip/extract/render

    - from: CLICommands
      to: LinksPackage
      relation: uses
      label: recover/compose

    - from: CLICommands
      to: RuntimeConfig
      relation: uses
      label: config

    - from: ValidationRuntime
      to: CoreRuntime
      relation: uses
      label: parse and render

    - from: CoreRuntime
      to: Handlers
      relation: uses
      label: node handling

    - from: Renderer
      to: RendererEngine
      relation: uses
      label: format output

    - from: CLIGraphOps
      to: CoreRuntime
      relation: uses
      label: AST + IR

    - from: CLIGraphOps
      to: QueryEngine
      relation: uses
      label: search records

    - from: CLIGraph
      to: CoreRuntime
      relation: uses
      label: AST store mapping

    - from: QueryEngine
      to: StoreIOPackage
      relation: reads
      label: load indexes

    - from: StoreDiagnostics
      to: ValidationRuntime
      relation: uses
      label: hash verification

    - from: StoreDiagnostics
      to: StoreDiagnosticsModels
      relation: uses
      label: structured results

    - from: StoreHashing
      to: ValidationRuntime
      relation: uses
      label: field hashing

    - from: StoreSubsystem
      to: StoreFiles
      relation: persists
      label: YAML indexes

    - from: SLDBCLI
      to: MarkdownDocs
      relation: reads_writes
      label: documents

    - from: LinksPackage
      to: StoreIOPackage
      relation: reads
      label: resolve links

    - from: StoreExport
      to: StoreSemantic
      relation: uses
      label: rebuild + export

    - from: StoreSemantic
      to: StoreSemanticTags
      relation: uses
      label: model flatten

    - from: StoreSectionRebuild
      to: StoreIOPackage
      relation: reads
      label: section indexing

    - from: StorePredicates
      to: StoreIOPackage
      relation: reads
      label: predicate indexing