id: sldb.current.components
title: "SLDB System Components (Post-Refactor)"
type: component
version: "2.0"

data:
  nodes:
    SLDBCLI:
      label: sldb CLI
      kind: core
      contains:
        - CLIDispatcher
        - CLIParsers
        - CLICommands
        - CLIGraphOps

    CLIDispatcher:
      label: cli.dispatcher
      kind: core

    CLIParsers:
      label: cli.parsers.*
      kind: core
      contains:
        - ParsersCore
        - ParsersModels
        - ParsersDocs
        - ParsersFind

    ParsersCore:
      label: parsers.core
      kind: core

    ParsersModels:
      label: parsers.models
      kind: core

    ParsersDocs:
      label: parsers.docs
      kind: core

    ParsersFind:
      label: parsers.find
      kind: core

    CLICommands:
      label: cli.commands.*
      kind: core
      contains:
        - DirectCommands
        - StoreCommands
        - QueryCommands

    DirectCommands:
      label: basic / init / help / faq
      kind: core

    StoreCommands:
      label: store / model / doc / inbox
      kind: core

    QueryCommands:
      label: find / sections / fields / explore
      kind: core

    CLIGraphOps:
      label: cli.graph_ops.*
      kind: core
      contains:
        - GraphBuildAST
        - GraphBuildIR
        - GraphIterRecords

    GraphBuildAST:
      label: graph_ops.build_ast
      kind: core

    GraphBuildIR:
      label: graph_ops.build_ir
      kind: core

    GraphIterRecords:
      label: graph_ops.iter_records
      kind: core

    StoreFacade:
      label: store.facade
      kind: interface

    CoreRuntime:
      label: Core Runtime
      kind: core
      contains:
        - ASTPackage
        - ContractsPackage
        - IRPackage
        - DataExtractor
        - TemplateExtractor
        - Renderer

    ASTPackage:
      label: core.ast.*
      kind: core

    ContractsPackage:
      label: core.contracts.*
      kind: core

    IRPackage:
      label: core.ir.*
      kind: core

    DataExtractor:
      label: core.data_extractor
      kind: core

    TemplateExtractor:
      label: core.template_extractor
      kind: core

    Renderer:
      label: core.renderer
      kind: core

    Handlers:
      label: core.handlers.*
      kind: core
      contains:
        - TextHandler
        - ListHandler
        - TableHandler
        - YamlHandler

    TextHandler:
      label: handlers.text
      kind: core

    ListHandler:
      label: handlers.list
      kind: core

    TableHandler:
      label: handlers.table
      kind: core

    YamlHandler:
      label: handlers.yaml
      kind: core

    RendererEngines:
      label: core.renderer_engine.*
      kind: core

    ExceptionsPackage:
      label: core.exceptions.*
      kind: core

    ModelContract:
      label: models.structured_doc
      kind: core

    ValidationRuntime:
      label: runtime.validation
      kind: core

    StoreSubsystem:
      label: Store Subsystem
      kind: core
      contains:
        - StoreModels
        - StoreIO
        - StoreHashing
        - StoreOps
        - StoreDiagnostics
        - StoreResolver
        - StoreSemantic
        - StoreExport
        - StoreMigration

    StoreModels:
      label: store.models.*
      kind: core

    StoreIO:
      label: store.io.*
      kind: core
      contains:
        - IODocuments
        - IOModels
        - IOLock
        - IOStoreIndex
        - IOSemanticDAG

    IODocuments:
      label: io.documents_index
      kind: core

    IOModels:
      label: io.models_index
      kind: core

    IOLock:
      label: io.lock
      kind: core

    IOStoreIndex:
      label: io.store_index
      kind: core

    IOSemanticDAG:
      label: io.semantic_dag
      kind: core

    StoreHashing:
      label: store.hashing
      kind: core

    StoreOps:
      label: store.ops
      kind: core

    StoreDiagnostics:
      label: store.diagnostics
      kind: core

    StoreResolver:
      label: store.resolver
      kind: core

    StoreSemantic:
      label: store.semantic
      kind: core

    StoreExport:
      label: store.export
      kind: core

    StoreMigration:
      label: store.migration
      kind: core

    QueryEngine:
      label: Query Engine
      kind: core
      contains:
        - QEStructural
        - QESemantic
        - QEGlobalSemantic
        - QEFilter

    QEStructural:
      label: query_engine.structural
      kind: core

    QESemantic:
      label: query_engine.semantic
      kind: core

    QEGlobalSemantic:
      label: query_engine.global_semantic
      kind: core

    QEFilter:
      label: query_engine.filter
      kind: core

    LinksPackage:
      label: links.*
      kind: core
      contains:
        - LinkParser
        - LinkResolver
        - LinkComposer
        - LinkRecovery

    LinkParser:
      label: links.parser
      kind: core

    LinkResolver:
      label: links.resolver
      kind: core

    LinkComposer:
      label: links.composer
      kind: core

    LinkRecovery:
      label: links.recovery
      kind: core

    Filesystem:
      label: Filesystem
      kind: boundary
      contains:
        - MarkdownDocs
        - StoreFiles

    MarkdownDocs:
      label: Markdown docs
      kind: boundary

    StoreFiles:
      label: .sldb YAML indexes
      kind: database

  edges:
    - from: CLICommands
      to: StoreFacade
      relation: uses
      label: domain operations

    - from: StoreFacade
      to: StoreSubsystem
      relation: delegates
      label: store operations

    - from: CLICommands
      to: ValidationRuntime
      relation: uses
      label: roundtrip/extract/render

    - from: ValidationRuntime
      to: CoreRuntime
      relation: uses
      label: parse and render

    - from: CoreRuntime
      to: Handlers
      relation: uses
      label: node handling

    - from: Renderer
      to: RendererEngines
      relation: uses
      label: format output

    - from: CLIGraphOps
      to: CoreRuntime
      relation: uses
      label: AST + IR

    - from: CLIGraphOps
      to: QueryEngine
      relation: uses
      label: search records

    - from: QueryEngine
      to: StoreIO
      relation: reads
      label: load indexes

    - from: StoreDiagnostics
      to: ValidationRuntime
      relation: uses
      label: hash verification

    - from: StoreHashing
      to: ValidationRuntime
      relation: uses
      label: field hashing

    - from: StoreSubsystem
      to: StoreFiles
      relation: persists
      label: YAML indexes

    - from: SLDBCLI
      to: MarkdownDocs
      relation: reads_writes
      label: documents

    - from: LinksPackage
      to: StoreIO
      relation: reads
      label: resolve links

    - from: StoreExport
      to: StoreSemantic
      relation: uses
      label: rebuild + export

    - from: CLICommands
      to: LinksPackage
      relation: uses
      label: recover/compose
