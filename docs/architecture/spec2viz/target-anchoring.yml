id: sldb.target.anchoring
title: Knowledge Kernel Anchoring Model
type: component
version: "0.2"

data:
  nodes:
    AnchorNode:
      label: Anchor node
      kind: core
      contains:
        - DocumentPath
        - SourceHash
        - StableSelector
        - SampleText
        - Comments
        - AnchorKind

    DocumentPath:
      label: source document path
      kind: core

    SourceHash:
      label: source hash / source fingerprint
      kind: core

    StableSelector:
      label: stable selector
      kind: core
      contains:
        - StructuralLocator
        - TextLocator
        - FamilySpecificLocator

    StructuralLocator:
      label: structural / AST locator
      kind: core

    TextLocator:
      label: text locator
      kind: core

    FamilySpecificLocator:
      label: family-specific locator
      kind: boundary
      contains:
        - PDFLocator
        - HTMLLocator
        - CodeLocator

    PDFLocator:
      label: page / XML locator
      kind: boundary

    HTMLLocator:
      label: DOM / element locator
      kind: boundary

    CodeLocator:
      label: syntax / tree-sitter locator
      kind: boundary

    SampleText:
      label: quoted text sample
      kind: core

    Comments:
      label: anchor comments
      kind: core

    AnchorKind:
      label: AST / text / external anchor kind
      kind: core

    ReversibleFamilies:
      label: reversible document families
      kind: boundary

  edges:
    - from: AnchorNode
      to: DocumentPath
      relation: requires
    - from: AnchorNode
      to: SourceHash
      relation: requires
    - from: AnchorNode
      to: StableSelector
      relation: requires
    - from: AnchorNode
      to: SampleText
      relation: may_include
    - from: AnchorNode
      to: Comments
      relation: may_include
    - from: AnchorNode
      to: AnchorKind
      relation: classifies
    - from: StableSelector
      to: StructuralLocator
      relation: may_use
    - from: StableSelector
      to: TextLocator
      relation: may_use
    - from: StableSelector
      to: FamilySpecificLocator
      relation: may_specialize_to
    - from: AnchorKind
      to: ReversibleFamilies
      relation: prefers
      label: AST-aware anchors where canonical structure exists
