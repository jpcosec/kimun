id: deskops.proposed.components
title: Deskops Proposed Workflow Components
type: component
version: "0.1"

data:
  nodes:
    DeskopsRuntime:
      label: deskops runtime
      kind: core
      contains:
        - ExistingDeskDocs
        - DeskWorkspace
        - WorkflowEngine
        - RitualAutomation
        - InterRepoMessaging
        - DocumentationPolicy

    ExistingDeskDocs:
      label: existing desk doc layer
      kind: core
      contains:
        - ExistingTasks
        - ExistingPills
        - ExistingBoards
        - ExistingSpecs
        - ExistingDeskProfiles

    ExistingTasks:
      label: TaskDoc / DeskTaskDoc
      kind: core

    ExistingPills:
      label: PillDoc
      kind: core

    ExistingBoards:
      label: DeskBoardDoc
      kind: core

    ExistingSpecs:
      label: DeskSpecDoc
      kind: core

    ExistingDeskProfiles:
      label: DeskProfile
      kind: core

    DeskWorkspace:
      label: desk workspace
      kind: core
      contains:
        - Inbox
        - Tasks
        - Pills
        - FutureWork
        - Atoms

    Inbox:
      label: inbox notes
      kind: core

    Tasks:
      label: task docs
      kind: core

    Pills:
      label: pill docs
      kind: core

    FutureWork:
      label: future-work docs
      kind: core

    Atoms:
      label: desk atoms
      kind: core

    WorkflowEngine:
      label: lifecycle + routing engine
      kind: core

    RitualAutomation:
      label: ritual automation
      kind: core

    InterRepoMessaging:
      label: inter-repo messaging
      kind: core

    DocumentationPolicy:
      label: documentation linter/policy
      kind: core

    SLDBInfra:
      label: SLDB infrastructure
      kind: boundary
      contains:
        - StructuredMarkdown
        - StoreLayer
        - QueryLayer

    StructuredMarkdown:
      label: StructuredNLDoc + templates
      kind: boundary

    StoreLayer:
      label: stores + hashes + indexes
      kind: database

    QueryLayer:
      label: find / sections / ast / explore
      kind: boundary

    RepoBoundaries:
      label: Multiple Project Repos
      kind: boundary

  edges:
    - from: DeskWorkspace
      to: SLDBInfra
      relation: uses
      label: tracked docs and stores

    - from: ExistingDeskDocs
      to: DeskWorkspace
      relation: materializes
      label: current document surfaces

    - from: WorkflowEngine
      to: DeskWorkspace
      relation: manages
      label: status and routing

    - from: RitualAutomation
      to: DeskWorkspace
      relation: automates
      label: close-loop routines

    - from: RitualAutomation
      to: RepoBoundaries
      relation: writes
      label: commits and repo ops

    - from: DocumentationPolicy
      to: DeskWorkspace
      relation: lints
      label: structure and completeness

    - from: InterRepoMessaging
      to: RepoBoundaries
      relation: routes
      label: inbox/task messages across repos

    - from: InterRepoMessaging
      to: Inbox
      relation: materializes
      label: durable message docs

    - from: Atoms
      to: Tasks
      relation: informs
      label: canonical knowledge

    - from: FutureWork
      to: Tasks
      relation: promotes_to
      label: actionable work

    - from: SLDBInfra
      to: QueryLayer
      relation: exposes
      label: reusable navigation
