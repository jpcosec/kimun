id: kimun.v2.store_layout
title: "kimun v2 — Files Backend: open, check and verify (formats 2/3/4)"
type: activity
version: "1.0"
# Source of truth: docs/v2/10 §5–§8 (format 2), §10 (format 3) and §11 (format 4); code:
# kimun.kernel.store, kimun.host.fs-store, kimun.host.store-cache.

data:
  start: open

  steps:
    open:
      label: "open backend host"
      next: read_descriptor

    read_descriptor:
      label: "read store.edn {:format-version 2|3|4 :hash-alg :capabilities …}; hash-alg must match the host Hasher"
      next: read_heads

    read_heads:
      label: "read heads.edn {:head rev-id :heads-root id} (absent before the first commit = empty store)"
      next: check_head

    check_head:
      label: "check the head Revision (H == id, 8 fields) and :heads-root (mmap node); open NEVER reads or replays log.edn"
      kind: decision
      branches:
        "ok": ready
        "missing / hash mismatch / wrong shape": fail_open

    fail_open:
      label: ":store/corrupt-heads | :store/corrupt-head (exit 5)"
      next: end

    ready:
      label: "lazy store value (store.edn + heads only); which command?"
      kind: decision
      branches:
        "any command (docs show…, commit)": ok_open
        "stores check": verify
        "stores verify / journal verify / replay-open": replay

    ok_open:
      label: "answer from the head Revision; other objects read on demand and never rehashed"
      next: end

    verify:
      label: "verify: reachable = closure from heads over revision → mmap :trees/:edges/:incidence → descriptors, tree objects, nodes, edges"
      next: cache_note

    cache_note:
      label: "format 4: a tree marked :cached? is NOT required in objects/; its integrity is the resolver's (registered root vs recomputed)"
      next: hash_files

    hash_files:
      label: "for each reachable id: H(objects/<id>) == id?"
      kind: decision
      branches:
        "all": ok
        "some differ or missing": bad

    ok:
      label: "{:ok? true :checked n}"
      next: end

    bad:
      label: "{:ok? false :bad [{:id :reason :hash-mismatch|:missing}]} (exit 5)"
      next: end

    replay:
      label: "replay log.edn: for each Transaction apply-plan(plan) and check tx/revision ids, :incidence and per-tree heads"
      next: replay_check

    replay_check:
      label: "final heads == heads.edn? and the log tail is :clean (a dead-writer tail is reported, not an error)"
      kind: decision
      branches:
        "consistent": verify
        "inconsistent / damaged line": fail_replay

    fail_replay:
      label: ":store/corrupt {:bad [{:reason :replay-failed}]} (exit 5)"
      next: end

  end: end
