id: sldb.v2.cas_objects
title: SLDB v2 — Content-Addressed Object Model
type: component
version: "1.0"
# Every object satisfies H(canonical-bytes hashed-form) == id (invariant 17).
# Source of truth: docs/v2/02 §2.1, §3.1, §3.2, §5.

data:
  nodes:
    Store:
      label: "Store (CAS: objects/<id>)"
      kind: database
      atoms:
        - atom-first-slice-runtime-choices
      contains:
        - Revision
        - TreeSet
        - EdgeSet
        - Descriptor
        - TreeObject
        - Node
        - Edge
        - ResolvedPlan

    Revision:
      label: "Revision {roots trees edges parents tx actor engines timestamp} · id = H(8 fields)"
      kind: core
      atoms:
        - atom-revision-id-edge-set-and-diff
    TreeSet:
      label: "tree-set [[tree-id descriptor-id] …] sorted"
      kind: core
    EdgeSet:
      label: "edge-set [edge-id …] sorted"
      kind: core
    Descriptor:
      label: "descriptor {:tree ULID :kind :name :root}"
      kind: core
      atoms:
        - atom-tree-identity-tree-objects-and-heads
    TreeObject:
      label: "tree object {:node :children [[child tree-hash] …]} (sibling order in hash)"
      kind: core
      atoms:
        - atom-tree-as-index
    Node:
      label: "Node {:class :kind :content} · S sign / M symbol / G fact"
      kind: core
      atoms:
        - atom-smg-node-pool
        - atom-canonical-content-and-node-hashing
    Edge:
      label: "Edge {:type :from :to [:tree :order] :evidence} · no timestamp"
      kind: core
      atoms:
        - atom-evidence-required-per-edge-type
    ResolvedPlan:
      label: "resolved plan (tx id = H(plan)) — Transaction map lives in log.edn"
      kind: core
      atoms:
        - atom-transactionplan-edn-schema-and-validation

    Heads:
      label: "heads.edn {:head rev :heads {tree-id rev}} (nominal refs, CAS)"
      kind: boundary
    Log:
      label: "log.edn — one Transaction {:id :plan :revision} per line"
      kind: boundary

  edges:
    - from: Heads
      to: Revision
      relation: points to
    - from: Revision
      to: Revision
      relation: parents
    - from: Revision
      to: TreeSet
      relation: trees
    - from: Revision
      to: EdgeSet
      relation: edges
    - from: Revision
      to: TreeObject
      relation: roots (merkle-root per tree)
    - from: Revision
      to: ResolvedPlan
      relation: tx
    - from: TreeSet
      to: Descriptor
      relation: lists
    - from: Descriptor
      to: Node
      relation: root
    - from: TreeObject
      to: TreeObject
      relation: children (ordered)
    - from: TreeObject
      to: Node
      relation: node
    - from: EdgeSet
      to: Edge
      relation: lists
    - from: Edge
      to: Node
      relation: from / to / evidence.context
    - from: Log
      to: ResolvedPlan
      relation: replays into
