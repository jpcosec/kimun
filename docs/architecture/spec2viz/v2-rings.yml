id: kimun.v2.rings
title: kimun v2 — Dependency Rings and Namespaces
type: component
version: "1.0"
# Source of truth: docs/v2/03-estandares-de-codigo.md §1. Arrows point inward only.
# Enforced by scripts/check_rings.clj (bb lint). Namespaces: decision 20 (`kimun.*`).

data:
  nodes:
    Ring0:
      label: "ring 0 · kimun.kernel.* (pure: data + functions; only clojure.* and kernel)"
      kind: core
      atoms:
        - atom-decision-pure-cljc-kernel-with-hosts-as-adapters
      contains:
        - ports
        - err
        - canon
        - node
        - pool
        - edge
        - tree
        - mmap
        - plan
        - revision
        - heads
        - reconcile
        - standoff
        - store
        - upgrade
        - legacy

    ports:
      label: "ports — Hasher · TextNormalizer · IdMinter · Backend (protocols)"
      kind: core
    err:
      label: "err — ex-info contract, rescue (kernel reader conditional)"
      kind: core
    canon:
      label: "canon — canonical-bytes, digest, normalize (§2.1)"
      kind: core
      atoms:
        - atom-canonical-content-and-node-hashing
    node:
      label: "node — 9 class/kind shapes, node-id (§2, §2.1)"
      kind: core
      atoms:
        - atom-smg-node-pool
    pool:
      label: "pool — in-memory id → node"
      kind: core
    edge:
      label: "edge — Edge/Evidence shapes, edge-id (§3.2)"
      kind: core
      atoms:
        - atom-evidence-required-per-edge-type
    tree:
      label: "tree — ULID ids, tree objects of positions, dirty set, merkle-root (§3.1)"
      kind: core
      atoms:
        - atom-tree-as-index
        - atom-tree-identity-tree-objects-and-heads
    mmap:
      label: "mmap — history-independent Merkle maps (:trees :edges :incidence, §5)"
      kind: core
    plan:
      label: "plan — schema, aliases, checks 5/6/7 (§5.1)"
      kind: core
      atoms:
        - atom-transactionplan-edn-schema-and-validation
    revision:
      label: "revision — apply-plan, Revision of 8 fields, diff, ConflictSet (§5, §5.2)"
      kind: core
      atoms:
        - atom-revision-id-edge-set-and-diff
        - atom-replace-semantics-inside-a-transaction
        - atom-conflictset-on-failed-compare-and-swap
    heads:
      label: "heads — CAS per entry, commit! (§3.1)"
      kind: core
    reconcile:
      label: "reconcile — drifted → proposal → supersedes (§6.5)"
      kind: core
      atoms:
        - atom-drifted-is-a-reconciled-orphan
    standoff:
      label: "standoff — UAX #29 layers, virtual addresses (§4.1)"
      kind: core
    store:
      label: "store — Backend port, init/open/verify/commit!, formats 2/3/4 (§8.1)"
      kind: core
      atoms:
        - atom-first-slice-runtime-choices
    upgrade:
      label: "upgrade — 1→2 rebuilt, 2→3 in place, 3→4 needs rebuild (§8)"
      kind: core
    legacy:
      label: "legacy.revision — format-1 engine, opens by replay"
      kind: core

    Ring1:
      label: "ring 1 · kimun.host.* (adapters: implement ports; reader conditionals; I/O)"
      kind: boundary
      contains:
        - host_hash
        - host_text
        - host_ulid
        - host_fs_store
        - host_lazy
        - host_store_cache
        - host_treesitter
        - host_default
    host_hash:
      label: "host.hash — Sha256 (MessageDigest / node crypto)"
      kind: service
    host_text:
      label: "host.text — NFC (java.text.Normalizer / String.normalize)"
      kind: service
    host_ulid:
      label: "host.ulid — ULID minting (SecureRandom / crypto)"
      kind: service
    host_fs_store:
      label: "host.fs-store — files backend (objects/, cache/, log.edn, heads.edn)"
      kind: database
    host_lazy:
      label: "host.lazy — lazy store maps (LazyMaps port)"
      kind: service
    host_store_cache:
      label: "host.store-cache — <store>/cache/ (derived tree objects and doc trees, format 4)"
      kind: database
    host_treesitter:
      label: "host.treesitter — marks the M-layer parser pod in process (pod-kimun-treesitter)"
      kind: service
    host_default:
      label: "host.default — composes the standard host {:hasher :text :ids}"
      kind: service

    Ring2:
      label: "ring 2 · kimun.surface.markdown.* (SLDB-MD profile: requires kernel + host)"
      kind: core
      contains:
        - md_cst
        - md_ast
        - md_inline
        - md_cst_ast
        - md_render
        - md_plan
        - md_report
    md_cst:
      label: "surface.markdown.cst — lossless CST (inv. 8)"
      kind: core
    md_ast:
      label: "surface.markdown.ast — neutral AST (§3.1)"
      kind: core
    md_inline:
      label: "surface.markdown.inline — marks, escapes, graphemes"
      kind: core
    md_cst_ast:
      label: "surface.markdown.cst-ast — tree-sitter CST → AST (phase 2)"
      kind: core
    md_render:
      label: "surface.markdown.render — canonical spelling (inv. 9)"
      kind: core
    md_plan:
      label: "surface.markdown.plan — AST ↔ store document tree (§8)"
      kind: core
    md_report:
      label: "surface.markdown.report — coverage and opaque regions (§9)"
      kind: core

    Ring3:
      label: "ring 3 · kimun.* product (cli.* and surface.* beyond markdown: models, graph, index, http, docs…)"
      kind: client

    Ring4:
      label: "ring 4 · tests (test/kimun/**, fixtures, generators)"
      kind: client

  edges:
    - from: host_hash
      to: ports
      relation: implements
    - from: host_text
      to: ports
      relation: implements
    - from: host_ulid
      to: ports
      relation: implements
    - from: host_fs_store
      to: store
      relation: implements Backend
    - from: host_lazy
      to: store
      relation: implements LazyMaps
    - from: host_store_cache
      to: store
      relation: cache reader (format 4)
    - from: host_treesitter
      to: ports
      relation: serves the M parser
    - from: host_default
      to: ports
      relation: composes host value
    - from: canon
      to: ports
      relation: uses host
    - from: node
      to: canon
      relation: uses
    - from: edge
      to: canon
      relation: uses
    - from: tree
      to: canon
      relation: uses
    - from: mmap
      to: canon
      relation: uses
    - from: plan
      to: canon
      relation: uses
    - from: revision
      to: plan
      relation: uses
    - from: revision
      to: tree
      relation: uses
    - from: revision
      to: mmap
      relation: uses
    - from: revision
      to: edge
      relation: uses
    - from: revision
      to: node
      relation: uses
    - from: reconcile
      to: edge
      relation: uses
    - from: standoff
      to: node
      relation: uses
    - from: heads
      to: revision
      relation: uses
    - from: store
      to: revision
      relation: uses
    - from: upgrade
      to: store
      relation: rebuilds
    - from: legacy
      to: revision
      relation: format-1 engine
    - from: Ring2
      to: Ring1
      relation: uses
    - from: Ring2
      to: Ring0
      relation: uses
    - from: Ring3
      to: Ring2
      relation: uses
    - from: Ring3
      to: Ring1
      relation: uses
    - from: Ring3
      to: Ring0
      relation: uses
    - from: Ring4
      to: Ring3
      relation: uses
    - from: Ring4
      to: Ring0
      relation: uses
