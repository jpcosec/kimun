[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sldb-cli"
version = "0.1.0"
description = "SLDB Python CLI"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
sldb = "sldb_cli:app"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "sldb-ffi" # we are building the ffi alongside, wait, maturin expects a single workspace or path
